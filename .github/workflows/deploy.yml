name: Build & Deploy

on:
  push:
    tags: ['v*']        # the only trigger: pushing v1.2.3 ships everything

permissions:
  contents: write       # create releases
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}   # one run at a time; newer tag cancels an older in-flight run
  cancel-in-progress: true

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

jobs:
  buildWebGL:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-WebGL-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        with:
          projectPath: .
          unityVersion: auto
          targetPlatform: WebGL
          buildsPath: build
          buildName: Web

      - name: Assemble Pages artifact
        run: |
          loader=$(find build -name '*.loader.js' | head -n 1)
          if [ -z "$loader" ]; then
            echo "No *.loader.js found. Actual build output:"
            find build -type f | head -50
            exit 1
          fi
          build_dir=$(dirname "$loader")
          tpl_dir=$(find build -type d -name TemplateData | head -n 1)

          mkdir -p publish/Build publish/TemplateData
          cp "$loader"                            publish/Build/Web.loader.js
          cp "$build_dir"/*.data.unityweb         publish/Build/Web.data.unityweb
          cp "$build_dir"/*.framework.js.unityweb publish/Build/Web.framework.js.unityweb
          cp "$build_dir"/*.wasm.unityweb         publish/Build/Web.wasm.unityweb
          cp -r "$tpl_dir"/.                      publish/TemplateData/

          sa_dir=$(find build -type d -name StreamingAssets | head -n 1)
          [ -n "$sa_dir" ] && cp -r "$sa_dir" publish/StreamingAssets

          for f in Web.loader.js Web.data.unityweb Web.framework.js.unityweb Web.wasm.unityweb; do
            [ -f "publish/Build/$f" ] || { echo "Missing publish/Build/$f"; exit 1; }
          done

          cp web/index.html publish/index.html
          cp web/coi-serviceworker.js publish/
          touch publish/.nojekyll
          printf 'DearBoids - WebGL build\n\nServe this folder with any static file server, e.g.:\n  python -m http.server 8000\nthen open http://localhost:8000\n(coi-serviceworker.js enables multithreading - keep it next to index.html)\n' > publish/HOW-TO-RUN.txt

          echo "--- publish ---"
          find publish -type f | sort

      - name: Zip web build (for release)
        run: |
          mkdir -p dist
          (cd publish && zip -qr ../dist/DearBoids-Web.zip .)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish

      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: dist/DearBoids-Web.zip
          retention-days: 7

  buildWindows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-StandaloneWindows64-

      - name: Build Windows
        uses: game-ci/unity-builder@v4
        with:
          projectPath: .
          unityVersion: auto
          targetPlatform: StandaloneWindows64
          buildsPath: build
          buildName: DearBoids

      - name: Zip Windows build
        run: |
          mkdir -p dist
          cp -r build/StandaloneWindows64 DearBoids
          zip -qr dist/DearBoids-Windows.zip DearBoids
          rm -rf DearBoids

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/DearBoids-Windows.zip
          retention-days: 7

  deployPages:
    needs: buildWebGL
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: [buildWebGL, buildWindows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Attach builds to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for f in dist/*.zip; do mv "$f" "${f%.zip}-$TAG.zip"; done
          ls -la dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --title "DearBoids $TAG" --generate-notes
          fi