name: Build & Deploy WebGL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write   # save Library cache
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-WebGL-

      # ── BUILD STEP — swap this block for the Unity CLI once its exact
      #    syntax is confirmed; the CLI still needs a license set via env. ──
      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .            # repo root = Unity project
          unityVersion: auto        # reads ProjectSettings/ProjectVersion.txt
          targetPlatform: WebGL
          buildsPath: build
          buildName: Web

      - name: Assemble Pages artifact
        run: |
          # GameCI's output layout varies — find the Unity output by its
          # loader file instead of hardcoding a path.
          loader=$(find build -name '*.loader.js' | head -n 1)
          if [ -z "$loader" ]; then
            echo "No *.loader.js found. Actual build output:"
            find build -type f | head -50
            exit 1
          fi
          build_dir=$(dirname "$loader")   # .../<output>/Build
          tpl_dir=$(find build -type d -name TemplateData | head -n 1)

          mkdir -p publish/Build publish/TemplateData
          cp "$loader"                            publish/Build/Web.loader.js
          cp "$build_dir"/*.data.unityweb         publish/Build/Web.data.unityweb
          cp "$build_dir"/*.framework.js.unityweb publish/Build/Web.framework.js.unityweb
          cp "$build_dir"/*.wasm.unityweb         publish/Build/Web.wasm.unityweb

          if compgen -G "$build_dir/*.worker.js.unityweb" > /dev/null; then
            cp "$build_dir"/*.worker.js.unityweb publish/Build/Web.worker.js.unityweb
          else
            echo "::warning::No worker file in build output — Multithreading may be off in Player Settings"
          fi

          # StreamingAssets only exists if the project has one
          sa_dir=$(find build -type d -name StreamingAssets | head -n 1)
          [ -n "$sa_dir" ] && cp -r "$sa_dir" publish/StreamingAssets

          cp "$tpl_dir"/. publish/TemplateData/
          cp web/index.html publish/index.html
          cp web/coi-serviceworker.js publish/
          touch publish/.nojekyll
          
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
