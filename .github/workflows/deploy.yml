name: Build & Deploy WebGL

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  actions: write   # save Library cache
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-WebGL-

      # ── BUILD STEP — swap this block for the Unity CLI once its exact
      #    syntax is confirmed; the CLI still needs a license set via env. ──
      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .            # repo root = Unity project
          unityVersion: auto        # reads ProjectSettings/ProjectVersion.txt
          targetPlatform: WebGL
          buildsPath: build
          buildName: Web
      # Upload raw output so you can inspect it: run page → Summary → Artifacts
      - name: Upload raw build (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build-raw
          path: build
          retention-days: 7

      - name: Assemble Pages artifact
        run: |
          loader=$(find build -name '*.loader.js' | head -n 1)
          if [ -z "$loader" ]; then
            echo "No *.loader.js found. Actual build output:"
            find build -type f | head -50
            exit 1
          fi
          build_dir=$(dirname "$loader")
          tpl_dir=$(find build -type d -name TemplateData | head -n 1)

          mkdir -p publish/Build publish/TemplateData
          cp "$loader"                            publish/Build/Web.loader.js
          cp "$build_dir"/*.data.unityweb         publish/Build/Web.data.unityweb
          cp "$build_dir"/*.framework.js.unityweb publish/Build/Web.framework.js.unityweb
          cp "$build_dir"/*.wasm.unityweb         publish/Build/Web.wasm.unityweb
          cp -r "$tpl_dir"/.                      publish/TemplateData/

          # StreamingAssets only exists if the project has one
          sa_dir=$(find build -type d -name StreamingAssets | head -n 1)
          [ -n "$sa_dir" ] && cp -r "$sa_dir" publish/StreamingAssets

          # Fail loudly if anything we're about to publish is missing
          for f in Web.loader.js Web.data.unityweb Web.framework.js.unityweb Web.wasm.unityweb; do
            [ -f "publish/Build/$f" ] || { echo "Missing publish/Build/$f"; exit 1; }
          done

          cp web/index.html publish/index.html
          cp web/coi-serviceworker.js publish/
          touch publish/.nojekyll

          echo "--- publish ---"
          find publish -type f | sort
          
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
